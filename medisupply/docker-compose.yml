services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: medisupply-ai-dashboard:local
    ports:
      - "${MEDISUPPLY_PORT:-8000}:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
